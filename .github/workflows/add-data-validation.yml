name: Add War Room data validation

on:
  push:
    paths:
      - '.github/workflows/add-data-validation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          if 'function validateData()' in s:
              print('Validation already installed; no patch needed.')
              raise SystemExit(0)

          s = s.replace('BOK War Room V0.3.1 — 2026', 'BOK War Room V0.3.2 — 2026')

          s = s.replace('</style>', '''
          .validationBanner{max-width:1500px;margin:14px auto 0;padding:0 22px}
          .validationCard{border-radius:12px;padding:12px 14px;font-weight:800;border:1px solid}
          .validationCard.ok{background:#e7f4eb;border-color:#a7d1b4;color:#255f3d}
          .validationCard.bad{background:#fae7e4;border-color:#dfaaa3;color:#8c2f27}
          .validationCard .small{display:block;font-size:12px;font-weight:650;margin-top:4px;line-height:1.4}
          </style>''', 1)

          runtime = '<div id="runtimeError" style="display:none;background:#8b1e14;color:white;padding:10px 22px;font-weight:800"></div>'
          s = s.replace(runtime, runtime + '\n<div class="validationBanner"><div id="validationCard" class="validationCard ok">DATA INTEGRITY: CHECKING…</div></div>', 1)

          marker = 'function gameId(g){ return `${g.Away}__${g.Home}`; }'
          validation = r'''
          function finiteNumber(v){ return typeof v==='number' && Number.isFinite(v); }
          function validateData(){
            const errors=[], warnings=[];
            const requiredRatingFields=['SP+ Rating','P&R Talent Rank','SP+ Z','Talent Z','Composite Z','V3 Rating','V3 Rank'];
            if(ratings.length!==138) errors.push(`Expected 138 FBS ratings; found ${ratings.length}.`);
            const seenTeams=new Set(), seenRanks=new Set();
            ratings.forEach((r,i)=>{
              const label=r.Team || `rating row ${i+1}`;
              if(!r.Team) errors.push(`Missing team name in rating row ${i+1}.`);
              if(seenTeams.has(r.Team)) errors.push(`Duplicate team rating: ${r.Team}.`);
              seenTeams.add(r.Team);
              requiredRatingFields.forEach(f=>{ if(!finiteNumber(r[f])) errors.push(`${label}: missing/invalid ${f}.`); });
              if(finiteNumber(r['P&R Talent Rank']) && (r['P&R Talent Rank']<1 || r['P&R Talent Rank']>138)) errors.push(`${label}: talent rank ${r['P&R Talent Rank']} is outside 1–138.`);
              if(finiteNumber(r['V3 Rank'])){ if(seenRanks.has(r['V3 Rank'])) errors.push(`Duplicate V3 rank #${r['V3 Rank']}.`); seenRanks.add(r['V3 Rank']); }
            });
            if(seenRanks.size!==138) errors.push(`Expected 138 unique V3 ranks; found ${seenRanks.size}.`);
            const games=currentGames(), seenGames=new Set();
            games.forEach((g,i)=>{
              const id=gameId(g), label=gameName(g) || `game ${i+1}`;
              if(seenGames.has(id)) errors.push(`Duplicate game: ${label}.`);
              seenGames.add(id);
              ['Away V3','Home V3','HFA to Home','Home Projected Margin','Splash Fav Spread','Model Edge'].forEach(f=>{ if(!finiteNumber(g[f])) errors.push(`${label}: missing/invalid ${f}.`); });
              if(!g.Away || !g.Home) errors.push(`Game ${i+1}: missing team.`);
              if(!seenTeams.has(g.Away)) errors.push(`${label}: ${g.Away} missing from ratings.`);
              if(!seenTeams.has(g.Home)) errors.push(`${label}: ${g.Home} missing from ratings.`);
              if(!g['BOK Fair Line']) errors.push(`${label}: missing BOK fair line.`);
              if(!g['Splash Favorite']) errors.push(`${label}: missing frozen Splash favorite.`);
              if(!g['ATS Pick']) errors.push(`${label}: missing ATS pick.`);
            });
            if(games.length===0) warnings.push(`Week ${currentWeek().week} has no games loaded yet.`);
            return {ok:errors.length===0,errors,warnings};
          }
          function renderValidation(){
            const result=validateData(), card=document.getElementById('validationCard');
            if(!card) return result;
            if(result.ok){
              card.className='validationCard ok';
              card.innerHTML=`✓ DATA INTEGRITY PASSED <span class="small">${ratings.length} team ratings validated · ${currentGames().length} Week ${currentWeek().week} games checked${result.warnings.length?' · '+result.warnings.join(' '):''}</span>`;
            }else{
              card.className='validationCard bad';
              const shown=result.errors.slice(0,5);
              card.innerHTML=`⚠ DATA INTEGRITY FAILED — ${result.errors.length} issue${result.errors.length===1?'':'s'} <span class="small">${shown.join(' · ')}${result.errors.length>5?' · …':''}</span>`;
            }
            return result;
          }
          '''
          s = s.replace(marker, marker + '\n' + validation, 1)

          old_lock = '''function updateLock(){
           const wk=currentWeek();
           document.getElementById('lockState').textContent=`WEEK ${wk.week} · ${wk.locked?'LOCKED':'PRELIMINARY'}`;
           document.getElementById('lockBtn').textContent=wk.locked?'Locked 🔒':'Lock Week';
           document.getElementById('lockBtn').disabled=wk.locked;
           renderWar();renderWeekSelector();
          }'''
          new_lock = '''function updateLock(){
           const wk=currentWeek(), validation=renderValidation();
           document.getElementById('lockState').textContent=`WEEK ${wk.week} · ${wk.locked?'LOCKED':'PRELIMINARY'}`;
           document.getElementById('lockBtn').textContent=wk.locked?'Locked 🔒':(validation.ok?'Lock Week':'Lock Blocked');
           document.getElementById('lockBtn').disabled=wk.locked || !validation.ok;
           renderWar();renderWeekSelector();
          }'''
          if old_lock not in s:
              raise RuntimeError('Could not locate updateLock block')
          s = s.replace(old_lock, new_lock, 1)

          click_old = '''document.getElementById('lockBtn').onclick=()=>{
           const wk=currentWeek(); if(wk.locked)return;
           if(!wk.games.length)return alert('This week has no games to lock.');'''
          click_new = '''document.getElementById('lockBtn').onclick=()=>{
           const wk=currentWeek(); if(wk.locked)return;
           const validation=validateData();
           if(!validation.ok)return alert('Lock blocked: fix data-integrity errors first.\\n\\n'+validation.errors.slice(0,8).join('\\n'));
           if(!wk.games.length)return alert('This week has no games to lock.');'''
          if click_old not in s:
              raise RuntimeError('Could not locate lock click handler')
          s = s.replace(click_old, click_new, 1)

          p.write_text(s, encoding='utf-8')
          print('Patched index.html with V0.3.2 data validation.')
      - name: Commit patch
        run: |
          git config user.name "BOK War Room Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add data integrity validation and lock guard"
            git push
          fi
