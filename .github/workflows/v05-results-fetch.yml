name: Install V0.5 Results Fetch
on:
  push:
    paths: ['.github/workflows/v05-results-fetch.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Results tab
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          if 'fetchResultsBtn' in s:
              print('Results fetch already installed'); raise SystemExit(0)
          s=s.replace('BOK War Room V0.4 — 2026','BOK War Room V0.5 — 2026',1)
          s=s.replace('<div class="panel"><div class="panelhead"><h3>Week Status</h3></div><div class="pad" id="resultStatus"></div></div>','<div class="panel"><div class="panelhead"><h3>Week Status</h3></div><div class="pad" id="resultStatus"></div><div class="pad" style="padding-top:0"><button class="btn" id="fetchResultsBtn">Fetch Week Results</button><div id="fetchResultsStatus" class="footerNote" style="margin-top:10px">Final scores only; frozen model inputs never change.</div></div></div>',1)
          marker='function renderResults(){'
          js=r'''
          function normTeamName(s){return String(s||'').toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]+/g,' ').replace(/\b(state|st)\b/g,'state').trim();}
          async function fetchWeekResults(){
            const wk=currentWeek(),btn=document.getElementById('fetchResultsBtn'),status=document.getElementById('fetchResultsStatus');
            btn.disabled=true;status.textContent='Fetching ESPN scoreboard…';
            try{
              const url=`https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?week=${wk.week}&seasontype=2&groups=80&limit=400`;
              const res=await fetch(url); if(!res.ok)throw new Error('Scoreboard request failed ('+res.status+').');
              const data=await res.json(), events=Array.isArray(data.events)?data.events:[];
              let found=0,finals=0,missing=[];
              for(const g of currentGames()){
                const a=normTeamName(g.Away),h=normTeamName(g.Home);
                const ev=events.find(e=>{
                  const c=e.competitions?.[0]?.competitors||[]; const names=c.map(x=>normTeamName(x.team?.displayName||x.team?.shortDisplayName||x.team?.name));
                  return names.includes(a)&&names.includes(h);
                });
                if(!ev){missing.push(gameName(g));continue;} found++;
                const comp=ev.competitions?.[0],cs=comp?.competitors||[],away=cs.find(x=>x.homeAway==='away'),home=cs.find(x=>x.homeAway==='home');
                const isFinal=!!(ev.status?.type?.completed||comp?.status?.type?.completed);
                if(!away||!home||!isFinal)continue;
                const awayScore=Number(away.score),homeScore=Number(home.score); if(!Number.isFinite(awayScore)||!Number.isFinite(homeScore))continue;
                const id=gameId(g),grade=atsGrade(g,awayScore,homeScore);
                wk.results[id]={awayScore,homeScore,grade,enteredAt:new Date().toISOString(),source:'ESPN scoreboard',eventId:ev.id||null}; finals++;
              }
              save();renderResults();renderAutopsy();
              status.textContent=`${finals} final${finals===1?'':'s'} imported · ${found}/${currentGames().length} slate games matched${missing.length?' · '+missing.length+' unmatched':''}.`;
            }catch(e){status.textContent='⚠ '+e.message+' You can still enter scores manually.';}
            finally{btn.disabled=false;}
          }
          '''
          s=s.replace(marker,js+'\n'+marker,1)
          s=s.replace("document.getElementById('drawerClose').onclick=()=>document.getElementById('intelDrawer').classList.remove('open');","document.getElementById('drawerClose').onclick=()=>document.getElementById('intelDrawer').classList.remove('open');\ndocument.getElementById('fetchResultsBtn').onclick=fetchWeekResults;",1)
          p.write_text(s,encoding='utf-8')
      - name: Commit V0.5
        run: |
          git config user.name "BOK War Room Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "Add automatic week results fetch" && git push)
