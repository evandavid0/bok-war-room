name: Install V0.5.2 Splash Proxy
on:
  push:
    paths: ['.github/workflows/v052-splash-proxy.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Splash picks sync to local JSON
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          s=s.replace('BOK War Room V0.5.1 — 2026','BOK War Room V0.5.2 — 2026',1)
          old="""const SPLASH_URL_KEY='bok_splash_leaderboard_url';"""
          if old not in s:
              raise SystemExit('Splash sync block not found')
          start=s.index(old)
          end=s.index('\nfunction renderStaff(){',start)
          new=r'''const SPLASH_URL_KEY='bok_splash_leaderboard_url';
function mapSplashPicker(entry){
  const display=String(entry?.entry?.displayName||'').trim();
  const handle=String(entry?.user?.handle||'').trim();
  const key=(display+' '+handle).toLowerCase();
  if(key.includes('evand')) return 'Evan';
  if(key.includes('travis')) return 'Travis';
  if(key.includes('dom')) return 'Dom';
  if(key.includes('mason')) return 'Mason';
  return null;
}
function splashGrade(v){
  const g=String(v||'').toLowerCase();
  if(g==='winning'||g==='won'||g==='win')return 'WIN';
  if(g==='losing'||g==='lost'||g==='loss')return 'LOSS';
  if(g==='push'||g==='pushed'||g==='tie'||g==='tied')return 'PUSH';
  return 'PENDING';
}
function splashPickText(p){
  const n=p?.team?.name||p?.team?.alias||'Unknown';
  const sp=Number(p?.spread);
  return Number.isFinite(sp)?`${n} ${sp>0?'+':''}${sp}`:n;
}
function splashGameForPick(p){
  const t=normTeamName(p?.team?.name||p?.team?.alias||'');
  return currentGames().find(g=>normTeamName(g.Away)===t||normTeamName(g.Home)===t)||null;
}
function configureSplashUrl(){
  alert('Splash now syncs server-side through GitHub. No browser URL setup is required.');
  return true;
}
async function fetchSplashPicks(){
  const btn=document.getElementById('fetchSplashPicksBtn'),status=document.getElementById('splashPickStatus');
  btn.disabled=true;status.textContent='Loading latest server-side Splash snapshot…';
  try{
    const res=await fetch(`./splash-picks.json?v=${Date.now()}`,{cache:'no-store'});
    if(!res.ok)throw new Error(`Splash snapshot request failed (${res.status}).`);
    const payload=await res.json(); const rows=Array.isArray(payload?.data)?payload.data:[];
    if(!rows.length)throw new Error('Latest Splash snapshot contains no leaderboard entries.');
    let imported=0,visible=0,recognized=0,unmatched=0;
    for(const row of rows){
      const picker=mapSplashPicker(row); if(!picker)continue; recognized++;
      const picks=Array.isArray(row?.picks?.data)?row.picks.data:[];
      for(const p of picks){
        visible++;
        const g=splashGameForPick(p); if(!g){unmatched++;continue;}
        const game=gameName(g),pick=splashPickText(p),grade=splashGrade(p.grade);
        const idx=state.staffPicks.findIndex(x=>x.season===2026&&x.week===state.activeWeek&&x.picker===picker&&x.game===game);
        const rec={season:2026,week:state.activeWeek,picker,game,pick,grade,ts:new Date().toISOString(),source:'Splash leaderboard',splashGameId:p.gameId||null};
        if(idx>=0)state.staffPicks[idx]={...state.staffPicks[idx],...rec}; else state.staffPicks.push(rec);
        imported++;
      }
    }
    save();renderStaff();
    const age=payload?.fetchedAt?` · server snapshot ${new Date(payload.fetchedAt).toLocaleString()}`:'';
    status.textContent=`${imported} pick${imported===1?'':'s'} synced · ${recognized} BOK picker${recognized===1?'':'s'} recognized · ${visible} visible Splash picks${unmatched?' · '+unmatched+' unmatched':''}${age}. Hidden/unlocked picks remain untouched.`;
  }catch(e){
    status.textContent='⚠ '+e.message+' The server-side Splash sync may still be publishing its first snapshot.';
  }finally{btn.disabled=false;}
}
'''
          s=s[:start]+new+s[end:]
          s=s.replace('<button class="btn ghost" id="setSplashUrlBtn">Set Splash URL</button>','',1)
          s=s.replace("document.getElementById('setSplashUrlBtn').onclick=configureSplashUrl;\n",'',1)
          s=s.replace('Syncs picks that Splash has made visible for the active week.','Loads the latest server-side Splash snapshot; browser CORS is bypassed.',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit V0.5.2
        run: |
          git config user.name "BOK War Room Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "Use server-side Splash picks snapshot" && git push)
