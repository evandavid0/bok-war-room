name: Install V0.8.1 Results Fetch Fix
on:
  push:
    paths:
      - '.github/workflows/v081-results-fetch.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/fix_results_fetch_v081.py
      - name: Commit patch
        run: |
          git config user.name "BOK War Room Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix ESPN week results fetch"
          git push