name: Install V0.8.5 Team Matching
on:
  push:
    paths:
      - '.github/workflows/v085-team-matching.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/fix_team_matching_v085.py
      - name: Commit patch
        run: |
          git config user.name "BOK War Room Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Harden ESPN team matching and diagnostics"
          git push
