name: Install V0.6 Game Intel Upgrade
on:
  push:
    paths: ['.github/workflows/v06-game-intel.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade Game Intel
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('BOK War Room V0.5.3 — 2026','BOK War Room V0.6 — 2026',1)
          css_anchor='.intelbox .label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:900}.intelbox .v{font-size:20px;font-weight:950;margin-top:3px}\n'
          css_add='''.intelbox .label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:900}.intelbox .v{font-size:20px;font-weight:950;margin-top:3px}\n.intelHero{border:1px solid var(--line);border-radius:14px;background:#fff8f1;padding:14px;margin-bottom:12px}.intelMatch{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}.intelTeam{font-size:20px;font-weight:950}.intelTeam.right{text-align:right}.intelVs{color:var(--muted);font-size:11px;font-weight:900}.intelCall{margin-top:12px;border-top:1px solid var(--line);padding-top:12px;display:flex;justify-content:space-between;gap:12px;align-items:center}.intelCall .pickbig{font-size:22px;font-weight:950;color:var(--burnt)}.intelSection{margin-top:14px;border:1px solid var(--line);border-radius:12px;background:white;padding:12px}.intelSection h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.07em}.componentRow{display:grid;grid-template-columns:92px 1fr 64px;gap:8px;align-items:center;margin:9px 0}.componentTrack{height:10px;background:#eee5dc;border-radius:99px;overflow:hidden}.componentTrack span{display:block;height:100%;background:var(--burnt);border-radius:99px}.componentVal{text-align:right;font-weight:900;font-variant-numeric:tabular-nums}.intelNote{font-size:11px;line-height:1.45;color:var(--muted);margin-top:8px}.marketGrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.marketBox{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}.marketBox .mLabel{font-size:9px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:900}.marketBox .mVal{font-size:17px;font-weight:950;margin-top:3px}@media(max-width:560px){.marketGrid{grid-template-columns:1fr}.intelMatch{grid-template-columns:1fr auto 1fr}.intelTeam{font-size:17px}}\n'''
          if css_anchor not in s: raise SystemExit('CSS anchor not found')
          s=s.replace(css_anchor,css_add,1)
          start=s.index('function openIntel(id){')
          end=s.index('\nfunction renderWeekSelector(){',start)
          fn=r'''function openIntel(id){
  const g=currentGames().find(x=>gameId(x)===id); if(!g)return;
  const ar=ratings.find(r=>r.Team===g.Away)||{},hr=ratings.find(r=>r.Team===g.Home)||{},res=(currentWeek().results||{})[id];
  const vals=ratings.map(r=>Number(r['SP+ Rating'])).filter(Number.isFinite);
  const mean=vals.reduce((a,b)=>a+b,0)/vals.length;
  const sd=Math.sqrt(vals.reduce((a,b)=>a+(b-mean)**2,0)/(Math.max(1,vals.length-1)));
  const spComponent=.8*(Number(hr['SP+ Z'])-Number(ar['SP+ Z']))*sd;
  const talentComponent=.2*(Number(hr['Talent Z'])-Number(ar['Talent Z']))*sd;
  const hfaComponent=Number(g['HFA to Home']);
  const homeMargin=Number(g['Home Projected Margin']);
  const splashHome=g['Splash Favorite']===g.Home?-Number(g['Splash Fav Spread']):Number(g['Splash Fav Spread']);
  const marketGap=homeMargin-splashHome;
  const maxComp=Math.max(Math.abs(spComponent),Math.abs(talentComponent),Math.abs(hfaComponent),1);
  const componentRow=(label,val)=>`<div class="componentRow"><b>${label}</b><div class="componentTrack"><span style="width:${Math.max(4,Math.abs(val)/maxComp*100)}%;opacity:${val<0?.55:1}"></span></div><div class="componentVal">${val>=0?'+':''}${val.toFixed(1)}</div></div>`;
  const side=marketGap>=0?g.Home:g.Away;
  const reason=Math.abs(spComponent)>=Math.abs(talentComponent)?'SP+':'Roster talent';
  document.getElementById('intelTitle').textContent=gameName(g);
  document.getElementById('intelBody').innerHTML=`
    <div class="intelHero">
      <div class="intelMatch"><div><div class="intelTeam">${g.Away}</div><div class="mini">V3 #${ar['V3 Rank']} · ${Number(g['Away V3']).toFixed(1)}</div></div><div class="intelVs">AT</div><div><div class="intelTeam right">${g.Home}</div><div class="mini" style="text-align:right">V3 #${hr['V3 Rank']} · ${Number(g['Home V3']).toFixed(1)}</div></div></div>
      <div class="intelCall"><div><div class="mini">OFFICIAL V3.0 ATS PICK</div><div class="pickbig">${g['ATS Pick']}</div></div><div style="text-align:right"><div class="mini">MODEL EDGE</div><div style="font-size:24px;font-weight:950">${Number(g['Model Edge']).toFixed(1)}</div></div></div>
    </div>
    <div class="marketGrid">
      <div class="marketBox"><div class="mLabel">BOK Fair Line</div><div class="mVal">${g['BOK Fair Line']}</div></div>
      <div class="marketBox"><div class="mLabel">Frozen Splash</div><div class="mVal">${splashText(g)}</div></div>
      <div class="marketBox"><div class="mLabel">Model vs Market</div><div class="mVal">${side} ${Math.abs(marketGap).toFixed(1)} pts</div></div>
    </div>
    <div class="intelSection"><h3>Team Inputs</h3><div class="intelgrid">
      <div class="intelbox"><div class="label">${g.Away} SP+</div><div class="v">${Number(ar['SP+ Rating']).toFixed(1)}</div><div class="mini">z ${Number(ar['SP+ Z']).toFixed(2)}</div></div>
      <div class="intelbox"><div class="label">${g.Home} SP+</div><div class="v">${Number(hr['SP+ Rating']).toFixed(1)}</div><div class="mini">z ${Number(hr['SP+ Z']).toFixed(2)}</div></div>
      <div class="intelbox"><div class="label">${g.Away} Talent</div><div class="v">#${ar['P&R Talent Rank']}</div><div class="mini">z ${Number(ar['Talent Z']).toFixed(2)}</div></div>
      <div class="intelbox"><div class="label">${g.Home} Talent</div><div class="v">#${hr['P&R Talent Rank']}</div><div class="mini">z ${Number(hr['Talent Z']).toFixed(2)}</div></div>
      <div class="intelbox"><div class="label">${g.Away} Composite Z</div><div class="v">${Number(ar['Composite Z']).toFixed(2)}</div></div>
      <div class="intelbox"><div class="label">${g.Home} Composite Z</div><div class="v">${Number(hr['Composite Z']).toFixed(2)}</div></div>
    </div></div>
    <div class="intelSection"><h3>Projected Margin Breakdown</h3>
      ${componentRow('80% SP+',spComponent)}${componentRow('20% Talent',talentComponent)}${componentRow('HFA',hfaComponent)}
      <div class="intelNote">Positive values favor ${g.Home}; negative values favor ${g.Away}. Components sum to the projected home margin of <b>${homeMargin.toFixed(1)}</b>. The larger rating driver in this matchup is <b>${reason}</b>.</div>
    </div>
    <div class="intelSection"><h3>Projection Guardrails</h3><div class="intelgrid"><div class="intelbox"><div class="label">Projected Score</div><div class="v">—</div><div class="mini">V3.0 models margin, not game total</div></div><div class="intelbox"><div class="label">Win Probability</div><div class="v">—</div><div class="mini">No calibrated win-probability layer in V3.0</div></div><div class="intelbox"><div class="label">Site</div><div class="v">${g['Neutral?']?'Neutral':'Home'}</div><div class="mini">HFA ${hfaComponent.toFixed(1)}</div></div><div class="intelbox"><div class="label">Snapshot</div><div class="v">W${currentWeek().week}</div><div class="mini">${currentWeek().snapshot?.snapshotDate||'—'}</div></div></div></div>
    ${res?`<div class="lockedNote" style="margin-top:14px"><b>FINAL:</b> ${g.Away} ${res.awayScore}, ${g.Home} ${res.homeScore} · <span class="grade${res.grade}">${res.grade}</span></div>`:''}
    <div class="footerNote">V3.0 = 80% standardized SP+ + 20% inverse-normal P&R talent, mapped back to the SP+ point scale. Fixed 2.5 HFA; neutral sites receive zero. Projected score and win probability are intentionally blank until separately calibrated rather than inferred with an undocumented heuristic.</div>`;
  document.getElementById('intelDrawer').classList.add('open');
}'''
          s=s[:start]+fn+s[end:]
          p.write_text(s,encoding='utf-8')
      - name: Commit upgrade
        run: |
          git config user.name "BOK War Room Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "Upgrade Game Intel for V0.6" && git push)
