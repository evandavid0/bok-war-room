name: Install V0.6 Game Intel Upgrade
on:
  push:
    paths:
      - '.github/workflows/v06-game-intel.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Game Intel patch
        run: python3 scripts/patch_game_intel.py
      - name: Commit upgrade
        run: |
          git config user.name "BOK War Room Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "Upgrade Game Intel for V0.6" && git push)
