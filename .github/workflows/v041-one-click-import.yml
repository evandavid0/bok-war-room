name: Install V0.4.1 One-Click Import
on:
  push:
    paths: ['.github/workflows/v041-one-click-import.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build weekly data and patch app
        shell: python
        run: |
          from pathlib import Path
          import re, json
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          # Seed weekly-data.json from the current official BASE snapshot so the button can be tested immediately.
          m=re.search(r'const BASE = (\{.*?\});\n',s,re.S)
          if not m:
              raise SystemExit('Could not locate BASE data')
          base=json.loads(m.group(1))
          Path('weekly-data.json').write_text(json.dumps({
              'schemaVersion':'1.0',
              'publishedAt':'2026-09-04T00:00:00-05:00',
              'meta':base['meta'],
              'ratings':base['ratings'],
              'games':base['games']
          },indent=2),encoding='utf-8')
          if 'id="latestImportBtn"' not in s:
              s=s.replace('BOK War Room V0.4 — 2026','BOK War Room V0.4.1 — 2026',1)
              target='<div class="panel" style="margin-top:18px"><div class="panelhead orange"><h3>3 · Build Snapshot</h3><span>No subjective adjustments</span></div><div class="pad">'
              repl=target+'<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px"><button class="btn secondary" id="latestImportBtn">↻ Import Latest Week</button><span class="mini">Fetches the verified weekly-data.json published to this repo.</span></div>'
              if target not in s: raise SystemExit('Build Snapshot panel anchor not found')
              s=s.replace(target,repl,1)
              marker='function csvRows(text){'
              js=r'''
          async function importLatestWeek(){
            const box=document.getElementById('importStatus'),btn=document.getElementById('latestImportBtn');
            btn.disabled=true;btn.textContent='Importing…';box.className='importStatus';box.textContent='Fetching verified BOK weekly package…';
            try{
              const resp=await fetch('./weekly-data.json?v='+Date.now(),{cache:'no-store'});if(!resp.ok)throw new Error('weekly-data.json returned HTTP '+resp.status);
              const pkg=await resp.json(),meta=pkg.meta||{},week=Number(meta.week);if(!Number.isInteger(week))throw new Error('Package is missing a valid week number.');
              if(!Array.isArray(pkg.ratings)||pkg.ratings.length!==138)throw new Error(`Package expected 138 ratings; found ${pkg.ratings?.length??0}.`);
              if(!Array.isArray(pkg.games)||!pkg.games.length)throw new Error('Package contains no slate games.');
              if(state.weeks[String(week)]?.locked)throw new Error(`Week ${week} is already locked and cannot be overwritten.`);
              const rankSet=new Set(pkg.ratings.map(r=>r['V3 Rank']));if(rankSet.size!==138)throw new Error('Package has duplicate or missing V3 ranks.');
              const teamSet=new Set(pkg.ratings.map(r=>r.Team));if(teamSet.size!==138)throw new Error('Package has duplicate team names.');
              for(const g of pkg.games){if(!teamSet.has(g.Away)||!teamSet.has(g.Home))throw new Error(`Slate team missing from ratings: ${g.Away} @ ${g.Home}`);if(!Number.isFinite(Number(g['Model Edge'])))throw new Error(`Invalid model edge: ${g.Away} @ ${g.Home}`);}
              const importedRatings=pkg.ratings.map(r=>({...r}));ratings.splice(0,ratings.length,...importedRatings);BASE.ratings=importedRatings;
              state.weeks[String(week)]={week,status:'PRELIMINARY',locked:false,lockTimestamp:null,games:pkg.games.map(g=>({...g})),results:state.weeks[String(week)]?.results||{},snapshot:{modelVersion:meta.modelVersion||'V3.0',snapshotDate:meta.snapshotDate||null,splashLock:meta.splashLock||null,rules:meta.rules||BASE.meta.rules,ratings:importedRatings,packagePublishedAt:pkg.publishedAt||null}};
              state.activeWeek=week;save();renderAll();box.className='importStatus good';box.innerHTML=`✓ <b>Week ${week}</b> imported from the verified repo package: ${importedRatings.length} ratings · ${pkg.games.length} games. Review the War Room, then lock when ready.`;
            }catch(e){box.className='importStatus bad';box.textContent='⚠ '+e.message;}finally{btn.disabled=false;btn.textContent='↻ Import Latest Week';}
          }
          '''
              if marker not in s: raise SystemExit('CSV parser anchor not found')
              s=s.replace(marker,js+'\n'+marker,1)
              bind="document.getElementById('buildWeekBtn').onclick=buildWeeklySnapshot;"
              if bind not in s: raise SystemExit('Build button binding anchor not found')
              s=s.replace(bind,bind+"\ndocument.getElementById('latestImportBtn').onclick=importLatestWeek;",1)
              s=s.replace("schemaVersion:'0.4'","schemaVersion:'0.4.1'",1)
              p.write_text(s,encoding='utf-8')
      - name: Commit V0.4.1
        run: |
          git config user.name "BOK War Room Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html weekly-data.json
          git diff --cached --quiet || (git commit -m "Build V0.4.1 one-click weekly import" && git push)
