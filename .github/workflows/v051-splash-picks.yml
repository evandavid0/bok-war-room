name: Install V0.5.1 Splash Picks Sync
on:
  push:
    paths: ['.github/workflows/v051-splash-picks.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch BOK vs World
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          if 'fetchSplashPicksBtn' in s:
              print('Splash picks sync already installed'); raise SystemExit(0)
          s=s.replace('BOK War Room V0.4.1 — 2026','BOK War Room V0.5.1 — 2026',1)
          old='<div class="panel" style="margin-top:18px"><div class="panelhead"><h2>Season Ledger</h2><button class="btn ghost" id="clearPicks">Clear Picks</button></div><div class="log" id="pickLog"></div></div>'
          new='<div class="panel" style="margin-top:18px"><div class="panelhead"><h2>Season Ledger</h2><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="fetchSplashPicksBtn">↻ Fetch Splash Picks</button><button class="btn ghost" id="setSplashUrlBtn">Set Splash URL</button><button class="btn ghost" id="clearPicks">Clear Picks</button></div></div><div class="pad" style="padding-bottom:0"><div id="splashPickStatus" class="footerNote" style="margin-top:0">Syncs picks that Splash has made visible for the active week.</div></div><div class="log" id="pickLog"></div></div>'
          if old not in s: raise SystemExit('Season Ledger anchor not found')
          s=s.replace(old,new,1)
          marker='function renderStaff(){'
          js=r'''
          const SPLASH_URL_KEY='bok_splash_leaderboard_url';
          function mapSplashPicker(entry){
            const display=String(entry?.entry?.displayName||'').trim();
            const handle=String(entry?.user?.handle||'').trim();
            const key=(display+' '+handle).toLowerCase();
            if(key.includes('evand')) return 'Evan';
            if(key.includes('travis')) return 'Travis';
            if(key.includes('dom')) return 'Dom';
            if(key.includes('mason')) return 'Mason';
            return null;
          }
          function splashGrade(v){
            const g=String(v||'').toLowerCase();
            if(g==='winning'||g==='won'||g==='win')return 'WIN';
            if(g==='losing'||g==='lost'||g==='loss')return 'LOSS';
            if(g==='push'||g==='pushed'||g==='tie'||g==='tied')return 'PUSH';
            return 'PENDING';
          }
          function splashPickText(p){
            const n=p?.team?.name||p?.team?.alias||'Unknown';
            const sp=Number(p?.spread);
            return Number.isFinite(sp)?`${n} ${sp>0?'+':''}${sp}`:n;
          }
          function splashGameForPick(p){
            const t=normTeamName(p?.team?.name||p?.team?.alias||'');
            return currentGames().find(g=>normTeamName(g.Away)===t||normTeamName(g.Home)===t)||null;
          }
          function configureSplashUrl(){
            const prior=localStorage.getItem(SPLASH_URL_KEY)||'';
            const url=prompt('Paste the Request URL for the Splash leaderboards XHR request. This is stored only in this browser.',prior);
            if(url===null)return false;
            const clean=url.trim(); if(!/^https?:\/\//i.test(clean)){alert('Please paste the full Request URL from DevTools → Headers → General.');return false;}
            localStorage.setItem(SPLASH_URL_KEY,clean); return true;
          }
          async function fetchSplashPicks(){
            const btn=document.getElementById('fetchSplashPicksBtn'),status=document.getElementById('splashPickStatus');
            let url=localStorage.getItem(SPLASH_URL_KEY)||'';
            if(!url){if(!configureSplashUrl())return;url=localStorage.getItem(SPLASH_URL_KEY)||'';}
            btn.disabled=true;status.textContent='Fetching Splash leaderboard…';
            try{
              const res=await fetch(url,{credentials:'include'});
              if(!res.ok)throw new Error(`Splash request failed (${res.status}).`);
              const payload=await res.json(); const rows=Array.isArray(payload?.data)?payload.data:[];
              if(!rows.length)throw new Error('Splash returned no leaderboard entries.');
              let imported=0,visible=0,recognized=0,unmatched=0;
              for(const row of rows){
                const picker=mapSplashPicker(row); if(!picker)continue; recognized++;
                const picks=Array.isArray(row?.picks?.data)?row.picks.data:[];
                for(const p of picks){
                  visible++;
                  const g=splashGameForPick(p); if(!g){unmatched++;continue;}
                  const game=gameName(g),pick=splashPickText(p),grade=splashGrade(p.grade);
                  const idx=state.staffPicks.findIndex(x=>x.season===2026&&x.week===state.activeWeek&&x.picker===picker&&x.game===game);
                  const rec={season:2026,week:state.activeWeek,picker,game,pick,grade,ts:new Date().toISOString(),source:'Splash leaderboard',splashGameId:p.gameId||null};
                  if(idx>=0)state.staffPicks[idx]={...state.staffPicks[idx],...rec}; else state.staffPicks.push(rec);
                  imported++;
                }
              }
              save();renderStaff();
              status.textContent=`${imported} pick${imported===1?'':'s'} synced · ${recognized} BOK picker${recognized===1?'':'s'} recognized · ${visible} visible Splash picks${unmatched?' · '+unmatched+' unmatched':''}. Hidden/unlocked picks remain untouched.`;
            }catch(e){
              status.textContent='⚠ '+e.message+' If this is a browser/CORS issue, use Set Splash URL to confirm the current leaderboard Request URL.';
            }finally{btn.disabled=false;}
          }
          '''
          if marker not in s: raise SystemExit('renderStaff anchor not found')
          s=s.replace(marker,js+'\n'+marker,1)
          hook="document.getElementById('staffGame').innerHTML=currentGames().map(g=>`<option>${gameName(g)}</option>`).join('');"
          add="document.getElementById('fetchSplashPicksBtn').onclick=fetchSplashPicks;\ndocument.getElementById('setSplashUrlBtn').onclick=configureSplashUrl;\n"+hook
          if hook not in s: raise SystemExit('staff hook anchor not found')
          s=s.replace(hook,add,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit V0.5.1
        run: |
          git config user.name "BOK War Room Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "Add Splash picks sync" && git push)
