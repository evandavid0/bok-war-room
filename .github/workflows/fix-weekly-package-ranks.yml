name: Fix weekly package V3 ranks
on:
  push:
    paths: ['.github/workflows/fix-weekly-package-ranks.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Derive package ranks
        shell: python
        run: |
          import json
          from pathlib import Path
          p=Path('weekly-data.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          ratings=d['ratings']
          ordered=sorted(ratings,key=lambda r: float(r['V3 Rating']),reverse=True)
          for i,r in enumerate(ordered,1): r['V3 Rank']=i
          ranks=[r['V3 Rank'] for r in ratings]
          assert len(ratings)==138
          assert sorted(ranks)==list(range(1,139))
          p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
      - name: Commit correction
        run: |
          git config user.name "BOK War Room Bot"
          git config user.email "actions@users.noreply.github.com"
          git add weekly-data.json
          git diff --cached --quiet || (git commit -m "Derive weekly package V3 ranks" && git push)
