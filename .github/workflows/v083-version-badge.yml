name: Install V0.8.3 Version Badge
on:
  push:
    paths:
      - '.github/workflows/v083-version-badge.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/add_version_badge_v083.py
      - name: Commit patch
        run: |
          git config user.name "BOK War Room Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Show app version in War Room header"
          git push
