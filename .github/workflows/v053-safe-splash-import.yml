name: Install V0.5.3 Safe Splash Import
on:
  push:
    paths:
      - '.github/workflows/v053-safe-splash-import.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch safe Splash response import
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('BOK War Room V0.5.1 — 2026','BOK War Room V0.5.3 — 2026',1)
          old='<button class="btn" id="fetchSplashPicksBtn">↻ Fetch Splash Picks</button><button class="btn ghost" id="setSplashUrlBtn">Set Splash URL</button>'
          new='<button class="btn" id="fetchSplashPicksBtn">Import Splash Response</button>'
          if old not in s:
              raise SystemExit('Season Ledger Splash buttons not found')
          s=s.replace(old,new,1)
          s=s.replace('Syncs picks that Splash has made visible for the active week.','Paste the JSON from DevTools → leaderboards → Response. No Splash login token is stored or transmitted.',1)

          marker="const SPLASH_URL_KEY='bok_splash_leaderboard_url';"
          start=s.find(marker)
          end=s.find('\nfunction renderStaff(){', start)
          if start<0 or end<0:
              raise SystemExit('Splash JS block not found')
          replacement=r'''function mapSplashPicker(entry){
  const display=String(entry?.entry?.displayName||'').trim();
  const handle=String(entry?.user?.handle||'').trim();
  const key=(display+' '+handle).toLowerCase();
  if(key.includes('evand')) return 'Evan';
  if(key.includes('travis')) return 'Travis';
  if(key.includes('dom')) return 'Dom';
  if(key.includes('mason')) return 'Mason';
  return null;
}
function splashGrade(v){
  const g=String(v||'').toLowerCase();
  if(g==='winning'||g==='won'||g==='win')return 'WIN';
  if(g==='losing'||g==='lost'||g==='loss')return 'LOSS';
  if(g==='push'||g==='pushed'||g==='tie'||g==='tied')return 'PUSH';
  return 'PENDING';
}
function splashPickText(p){
  const n=p?.team?.name||p?.team?.alias||'Unknown';
  const sp=Number(p?.spread);
  return Number.isFinite(sp)?`${n} ${sp>0?'+':''}${sp}`:n;
}
function splashGameForPick(p){
  const t=normTeamName(p?.team?.name||p?.team?.alias||'');
  return currentGames().find(g=>normTeamName(g.Away)===t||normTeamName(g.Home)===t)||null;
}
function importSplashPayload(payload){
  const status=document.getElementById('splashPickStatus');
  const rows=Array.isArray(payload?.data)?payload.data:[];
  if(!rows.length)throw new Error('Splash response contains no leaderboard entries.');
  let imported=0,visible=0,recognized=0,unmatched=0;
  for(const row of rows){
    const picker=mapSplashPicker(row); if(!picker)continue; recognized++;
    const picks=Array.isArray(row?.picks?.data)?row.picks.data:[];
    for(const p of picks){
      visible++;
      const g=splashGameForPick(p); if(!g){unmatched++;continue;}
      const game=gameName(g),pick=splashPickText(p),grade=splashGrade(p.grade);
      const idx=state.staffPicks.findIndex(x=>x.season===2026&&x.week===state.activeWeek&&x.picker===picker&&x.game===game);
      const rec={season:2026,week:state.activeWeek,picker,game,pick,grade,ts:new Date().toISOString(),source:'Splash leaderboard response',splashGameId:p.gameId||null};
      if(idx>=0)state.staffPicks[idx]={...state.staffPicks[idx],...rec}; else state.staffPicks.push(rec);
      imported++;
    }
  }
  save();renderStaff();
  status.textContent=`${imported} pick${imported===1?'':'s'} imported · ${recognized} BOK picker${recognized===1?'':'s'} recognized · ${visible} visible Splash picks${unmatched?' · '+unmatched+' unmatched':''}. Hidden/unlocked picks remain untouched.`;
}
function fetchSplashPicks(){
  const status=document.getElementById('splashPickStatus');
  const raw=prompt('Paste the full JSON from Splash DevTools → leaderboards request → Response. Do NOT paste Headers, Authorization, cookies, or tokens.');
  if(raw===null)return;
  try{
    const payload=JSON.parse(raw.trim());
    importSplashPayload(payload);
  }catch(e){
    status.textContent='⚠ Import failed: '+e.message;
  }
}
'''
          s=s[:start]+replacement+s[end:]
          s=s.replace("document.getElementById('setSplashUrlBtn').onclick=configureSplashUrl;\n",'',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit V0.5.3
        shell: bash
        run: |
          git config user.name "BOK War Room Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Add safe Splash response import"
            git push
          fi
