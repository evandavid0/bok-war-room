name: Sync Splash Picks
on:
  push:
    paths: ['.github/workflows/splash-sync.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Splash leaderboard
        shell: python
        run: |
          import json, urllib.request, datetime, pathlib
          url='https://api.splashsports.com/contests-service-v2/api/leaderboards?contestId=contest_01KZGZA9C4T4GF295ZWNW1PTWF&slateId=slate_01KZGZA9C3STTJZGJNDS2XS704&picksSlateId=slate_01KZGZA9C3STTJZGJNDS2XS704&includeOwnLivePicks=true&limit=25'
          req=urllib.request.Request(url, headers={
              'User-Agent':'Mozilla/5.0 BOK-War-Room/1.0',
              'Accept':'application/json,text/plain,*/*',
              'Origin':'https://contests.app.splashsports.com',
              'Referer':'https://contests.app.splashsports.com/'
          })
          with urllib.request.urlopen(req, timeout=30) as r:
              payload=json.load(r)
          rows=payload.get('data') if isinstance(payload,dict) else None
          if not isinstance(rows,list):
              raise SystemExit('Splash response did not contain a data array')
          out={
              'schemaVersion':'1.0',
              'fetchedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'source':'Splash Sports leaderboard',
              'contestId':'contest_01KZGZA9C4T4GF295ZWNW1PTWF',
              'slateId':'slate_01KZGZA9C3STTJZGJNDS2XS704',
              'data':rows,
              'included':payload.get('included',{}) if isinstance(payload,dict) else {}
          }
          pathlib.Path('splash-picks.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          print(f'Fetched {len(rows)} leaderboard entries')
      - name: Commit snapshot
        run: |
          git config user.name "BOK War Room Bot"
          git config user.email "actions@users.noreply.github.com"
          git add splash-picks.json
          git diff --cached --quiet || (git commit -m "Refresh Splash picks snapshot" && git push)
